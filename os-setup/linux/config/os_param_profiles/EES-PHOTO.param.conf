# ==============================================================================
# os_param_profiles/EES-PHOTO.param.conf
# ==============================================================================
# sysctl.conf 줄과 limits.conf 줄을 한 파일에 같이 쓴다. 순서/구간 구분
#없이 섞어 써도 되며, os_param_apply.sh가 아래 규칙으로 자동 분류한다:
#   - "=" 포함 -> sysctl.conf 형식 ("key = value")로 보고
#     /etc/sysctl.d/99-migration-<프로파일>.conf 에 적용
#   - "=" 미포함 -> limits.conf 형식 ("domain type item value", 공백 구분
#     4컬럼)으로 보고 /etc/security/limits.d/99-migration-<프로파일>.conf 에 적용
# 두 형식 다 원래 문법을 그대로 쓰면 되고(커스텀 문법 없음), "=" 유무만
# 보고 갈리므로 별도 섹션 표시(#로 나누는 등)도 필요 없다.
#
# 아래 값은 예시이며, 실제 AS-IS 서버에서 Assessment 스크립트로 수집한
# os_parameters.txt를 참고해 이 프로파일에 맞는 실제 값으로 채워야 한다.
# ==============================================================================

# --- sysctl ---
kernel.shmmax = 68719476736
kernel.shmall = 4294967296
kernel.sem = 250 32000 100 128
fs.file-max = 6815744
net.core.rmem_max = 4194304
net.core.wmem_max = 1048576

# --- limits ---
oracle  soft  nofile  65536
oracle  hard  nofile  65536
oracle  soft  nproc   16384
oracle  hard  nproc   16384

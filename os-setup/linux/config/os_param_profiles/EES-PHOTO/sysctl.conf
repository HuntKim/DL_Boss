# ==============================================================================
# os_param_profiles/EES-PHOTO/sysctl.conf
# ==============================================================================
# 네이티브 sysctl.conf 형식 그대로 작성한다 (커스텀 파싱 불필요).
# os_param_apply.sh가 이 파일을 /etc/sysctl.d/99-migration-EES-PHOTO.conf 로
# 복사하고 "sysctl --system"을 실행해 적용한다.
#
# 아래 값은 예시이며, 실제 AS-IS 서버에서 Assessment 스크립트로 수집한
# os_parameters.txt(sysctl -a 결과)를 참고해 이 프로파일에 맞는 실제 값으로
# 채워야 한다.
# ==============================================================================
kernel.shmmax = 68719476736
kernel.shmall = 4294967296
kernel.sem = 250 32000 100 128
fs.file-max = 6815744
net.core.rmem_max = 4194304
net.core.wmem_max = 1048576

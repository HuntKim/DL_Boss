# ==============================================================================
# os_param_profiles/EES-PHOTO/limits.conf
# ==============================================================================
# 네이티브 /etc/security/limits.conf 형식 그대로 작성한다.
# os_param_apply.sh가 이 파일을 /etc/security/limits.d/99-migration-EES-PHOTO.conf
# 로 복사해 적용한다.
#
# 아래 값은 예시이며, 실제 AS-IS 서버 수집 결과를 참고해 채워야 한다.
# ==============================================================================
oracle  soft  nofile  65536
oracle  hard  nofile  65536
oracle  soft  nproc   16384
oracle  hard  nproc   16384
